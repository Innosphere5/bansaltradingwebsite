<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006b55;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="#d97706" stroke-width="4" opacity="0.6"/>

  <!-- Stylized "B" grain/wheat icon -->
  <!-- Main stalk -->
  <line x1="100" y1="145" x2="100" y2="60" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>

  <!-- Left grains -->
  <ellipse cx="83" cy="90" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(-35 83 90)" opacity="0.95"/>
  <ellipse cx="79" cy="108" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(-40 79 108)" opacity="0.9"/>
  <ellipse cx="81" cy="126" rx="11" ry="6.5" fill="url(#leafGrad)" transform="rotate(-40 81 126)" opacity="0.85"/>

  <!-- Right grains -->
  <ellipse cx="117" cy="90" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(35 117 90)" opacity="0.95"/>
  <ellipse cx="121" cy="108" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(40 121 108)" opacity="0.9"/>
  <ellipse cx="119" cy="126" rx="11" ry="6.5" fill="url(#leafGrad)" transform="rotate(40 119 126)" opacity="0.85"/>

  <!-- Top grain head -->
  <ellipse cx="100" cy="67" rx="8" ry="12" fill="url(#leafGrad)" opacity="1"/>

  <!-- Letter B - bottom text area  -->
  <rect x="28" y="150" width="144" height="36" rx="8" fill="#d97706" opacity="0.15"/>
  <text x="100" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#f9e4a0" letter-spacing="1">BANSAL</text>
</svg>
